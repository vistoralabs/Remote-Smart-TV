name: Build Android APK

# Builds an installable debug APK in the cloud. No Android Studio needed.
# Run it from the repo's Actions tab, then download the "universal-tv-remote-apk"
# artifact and install it on your phone.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "mobile/**"
      - "android/**"
      - "capacitor.config.ts"
      - "vite.mobile.config.ts"
      - "package.json"
      - ".github/workflows/android.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install

      - name: Build web bundle for the WebView
        run: bun run build:mobile

      - name: Sync Capacitor Android project
        run: bunx cap sync android

      - name: Verify packaged WebView assets
        run: |
          test -f android/app/src/main/assets/public/index.html
          test -n "$(find android/app/src/main/assets/public/assets -type f -name '*.js' -print -quit)"
          test -n "$(find android/app/src/main/assets/public/assets -type f -name '*.css' -print -quit)"

      - name: Build signed release APK + AAB
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload APK and Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: universal-tv-remote-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

